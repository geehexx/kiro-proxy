name: CI

# CI temporarily disabled — runner setup fails before any workflow step can
# execute (since 2026-05-15 19:09Z; runs return in 2-3s with empty `steps`).
# Root cause appears to be GitHub-side (billing/quota/runner-pool exhaustion),
# NOT a code regression — see open PRs #6/#7/#8 (and now #10/#11/#12/#13/#14)
# that all fail identically on every branch. Workflows are kept under
# workflow_dispatch only (manual run) so the YAML stays in version control
# and re-enabling later is a one-line revert. Re-enable by restoring the
# `push:` and `pull_request:` triggers when the runner issue is resolved.
on:
  workflow_dispatch:  # manual-run only — see comment block above

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check kiro/

      - name: Run tests
        run: uv run pytest tests/ -q --no-header

  security:
    name: Security audit (bandit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run bandit
        run: uv run bandit -r kiro/ -ll
