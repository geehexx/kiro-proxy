[pytest]
# pytest configuration for the project
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add the project root to PYTHONPATH
pythonpath = .

# Markers registry. Unknown markers are warned about and fail
# strict-markers mode; declaring them here keeps the default run clean.
markers =
    live: Opt-in live smoke tests that hit a running kiro-gateway. Require KIRO_GATEWAY_URL and KIRO_GATEWAY_API_KEY; skipped by default via addopts.
    integration: Integration tests requiring external services.

# Exclude manual_api_test.py from automatic discovery
# (it is a manual real-API test script, not a unit test).
# Run it explicitly with: python manual_api_test.py
#
# Also skip the live/ directory by default; run explicitly with
# ``pytest tests/live -m live`` after setting KIRO_GATEWAY_API_KEY.
norecursedirs = .git __pycache__ old requests _notes live
addopts = -m "not live"

# Suppress loguru/logging output during tests — only show WARNING+ from stdlib logging.
# Logfire telemetry is already gated by PYTEST_CURRENT_TEST in telemetry.py.
log_cli = false
log_level = WARNING