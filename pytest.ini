[pytest]
# pytest configuration for the project
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add the project root to PYTHONPATH
pythonpath = .

# Exclude manual_api_test.py from automatic discovery
# (it is a manual real-API test script, not a unit test).
# Run it explicitly with: python manual_api_test.py
norecursedirs = .git __pycache__ old requests _notes